{% extends "base.html" %}

{% block content %}

<style>

.container{
    max-width:1000px;
    margin:auto;
}

.card{
    background:white;
    padding:25px;
    border-radius:16px;
    box-shadow:0 10px 25px rgba(0,0,0,0.06);
    border:1px solid #eee;
}

.title{
    font-size:28px;
    font-weight:700;
    margin-bottom:20px;
}

.anuncio{
    white-space:pre-wrap;
    line-height:1.7;
    font-size:16px;
}

.btn{
    display:inline-block;
    margin-top:20px;
    background:linear-gradient(90deg,#7c3aed,#ec4899);
    color:white;
    padding:12px 18px;
    border-radius:10px;
    text-decoration:none;
    font-weight:600;
}

</style>

<div class="container">

    <div class="title">
        {{ t("ai_announcement_generated") }}
    </div>

    <div class="card">

        <div class="anuncio">
            {{ anuncio }}
        </div>

    </div>

    <a href="/vaga/{{ vaga.id }}" class="btn">
        {{ t("back_to_job") }}
    </a>

</div>

{% endblock %}
