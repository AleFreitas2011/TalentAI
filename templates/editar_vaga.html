{% extends "base.html" %}

{% block content %}

<div style="max-width:700px;margin:auto;">

    <h1 style="
        background: linear-gradient(90deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom:20px;
    ">
        {{ t("edit_job") }}
    </h1>

    <div style="
        background:white;
        padding:25px;
        border-radius:12px;
        box-shadow:0 8px 25px rgba(0,0,0,0.05);
    ">

        <form action="/editar_vaga" method="post">

            <input type="hidden" name="vaga_id" value="{{ vaga.id }}">

            <!-- CLIENTE -->
            <label style="font-weight:bold;color:#374151;">
                {{ t("client") }}
            </label>

            <select name="cliente_id" required style="
                width:100%;
                padding:10px;
                margin-top:5px;
                margin-bottom:15px;
                border:1px solid #e5e7eb;
                border-radius:8px;
            ">
                <option value="">{{ t("select_client") }}</option>

                {% for c in clientes %}
                <option
                    value="{{ c.id }}"
                    {% if c.id == vaga.cliente_id %}selected{% endif %}
                >
                    {{ c.nome_contato }}
                </option>
                {% endfor %}

            </select>

            <!-- TÍTULO -->
            <label style="font-weight:bold;color:#374151;">
                {{ t("job_title") }}
            </label>

            <input
                type="text"
                name="titulo"
                value="{{ vaga.titulo }}"
                required
                style="
                    width:100%;
                    padding:10px;
                    margin-top:5px;
                    margin-bottom:15px;
                    border:1px solid #e5e7eb;
                    border-radius:8px;
                "
            >

            <!-- DESCRIÇÃO -->
            <label style="font-weight:bold;color:#374151;">
                {{ t("job_description") }}
            </label>

            <textarea
                name="descricao"
                rows="6"
                style="
                    width:100%;
                    padding:10px;
                    margin-top:5px;
                    margin-bottom:15px;
                    border:1px solid #e5e7eb;
                    border-radius:8px;
                "
            >{{ vaga.descricao }}</textarea>

            <!-- PALAVRAS-CHAVE -->
            <label style="font-weight:bold;color:#374151;">
                {{ t("keywords") }}
            </label>

            <input
                type="text"
                name="palavras_chave"
                value="{{ vaga.palavras_chave }}"
                placeholder="{{ t('keywords_placeholder') }}"
                style="
                    width:100%;
                    padding:10px;
                    margin-top:5px;
                    border:1px solid #e5e7eb;
                    border-radius:8px;
                "
            >

            <!-- DICA -->
            <p style="
                font-size:13px;
                color:#6b7280;
                margin-top:6px;
                margin-bottom:15px;
            ">
                {{ t("required_skills_help") }}
                <br>
                Ex: <i>sap sd*, s4hana*, otc, ingles</i>
                <br>
                {{ t("weighted_skills_help") }}
            </p>

            <!-- STATUS -->
            <label style="font-weight:bold;color:#374151;">
                {{ t("status") }}
            </label>

            <select
                name="status"
                style="
                    width:100%;
                    padding:10px;
                    margin-top:5px;
                    margin-bottom:20px;
                    border:1px solid #e5e7eb;
                    border-radius:8px;
                "
            >

                <option
                    value="Aberta"
                    {% if vaga.status == "Aberta" %}selected{% endif %}
                >
                    {{ t("open_status") }}
                </option>

                <option
                    value="Finalizada"
                    {% if vaga.status == "Finalizada" %}selected{% endif %}
                >
                    {{ t("closed_status") }}
                </option>

            </select>

            <!-- BOTÕES -->
            <div style="display:flex;gap:10px;">

                <button
                    type="submit"
                    style="
                        background: linear-gradient(90deg, #2563eb, #7c3aed);
                        color:white;
                        border:none;
                        padding:12px 20px;
                        border-radius:10px;
                        cursor:pointer;
                        font-weight:bold;
                    "
                >
                    {{ t("update_job") }}
                </button>

                <a
                    href="/vaga/{{ vaga.id }}"
                    style="
                        background:#f3f4f6;
                        color:#374151;
                        padding:12px 20px;
                        border-radius:10px;
                        text-decoration:none;
                    "
                >
                    {{ t("back") }}
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
