<a href="{{ card_link }}" class="dashboard-link">

    <div class="dashboard-card {{ card_class }}">

        <div class="dashboard-number">
            {{ card_value }}
        </div>

        <div class="dashboard-label">
            {{ card_title }}
        </div>

        <div class="dashboard-footer">
            {{ card_footer }}
        </div>

    </div>

</a>
