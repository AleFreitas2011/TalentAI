<section class="executive-ai-card">

    <div class="executive-ai-header">

        <div>

            <div class="executive-ai-label">

                Executive AI Copilot

            </div>

            <h2>

                {{ talia.greeting }}

            </h2>

        </div>

        <div class="executive-ai-badge">

            TALIA AI

        </div>

    </div>

    <p class="executive-ai-summary">

        {{ talia.summary }}

    </p>

    <div class="executive-ai-grid">

        <div class="executive-ai-item">

            <span>{{ total_vagas }}</span>

            <small>Active Jobs</small>

        </div>

        <div class="executive-ai-item">

            <span>{{ total_candidatos }}</span>

            <small>Candidates</small>

        </div>

        <div class="executive-ai-item">

            <span>{{ matches_90 }}</span>

            <small>Top Matches</small>

        </div>

        <div class="executive-ai-item">

            <span>{{ media_match }}%</span>

            <small>Average Match</small>

        </div>

    </div>

    <div class="executive-ai-recommendation">

        <strong>AI Recommendation</strong>

        <p>

            {{ talia.recommendation }}

        </p>

    </div>

</section>
