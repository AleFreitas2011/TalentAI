<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Login - TalentAI</title>
    <style>

        body {
            font-family: 'Inter', Arial, sans-serif;
            background: linear-gradient(
                135deg,
                #f8fafc 0%,
                #eef2ff 50%,
                #f8fafc 100%
            );
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container{
            display:flex;
            justify-content:center;
            align-items:center;
            width:100%;
        }

        .box{

            width:420px;
            padding:48px;
            background:#ffffff;
            border-radius:24px;
            border:1px solid #E5E7EB;
            box-shadow:
                0 20px 60px rgba(15,23,42,.10);

        }

        .logo{
            display:flex;
            justify-content:center;
            align-items:center;
            margin-bottom:28px;
        }

        .logo img{
            width:240px;
            height:auto;
            transform: translateX(6px);
        }

        .box h1{
            margin:0;
            text-align:center;
            font-size:48px;
            font-weight:800;
            color:#0F172A;
        }

        .subtitle{
            text-align:center;
            color:#64748B;
            font-size:16px;
            margin:12px 0 40px;
        }
        
        h2{
            text-align:center;
            font-size:36px;
            font-weight:700;
            color:#0F172A;
            margin:0 0 12px;
        }

        .description{
            text-align:center;
            color:#64748B;
            font-size:16px;
            line-height:1.6;
            margin-bottom:35px;
        }
        
        input{
            width:100%;
            padding:16px 18px;
            margin-bottom:16px;

            border:1px solid #D1D5DB;
            border-radius:12px;

            font-size:16px;

            background:#FFFFFF;
            transition:.25s;
            box-sizing:border-box;
        }

        input:focus{
            outline:none;
            border-color:#2563EB;
            box-shadow:0 0 0 4px rgba(37,99,235,.12);
        }
        
        button{

            width:100%;
            padding:16px;
            border:none;
            border-radius:12px;
            font-size:16px;
            font-weight:600;
            color:white;
            background:linear-gradient(
                90deg,
                #2563EB,
                #3B82F6
            );

            cursor:pointer;

            transition:.25s;
        }
        
        button:hover{
            transform:translateY(-1px);
            box-shadow:
                0 10px 24px rgba(37,99,235,.25);
        }
        
        .link {
            text-align: center;
            margin-top: 10px;
        }
        
        .link a {
            text-decoration: none;
            color: #2563eb;
        }
        .form-group{

    margin-bottom:22px;

        }

        .form-group label{
            display:block;
            margin-bottom:10px;
            font-size:14px;
            font-weight:600;
            color:#334155;
        }

        .form-options{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:28px;
            font-size:14px;
        }

        .remember{
            display:flex;
            align-items:center;
            gap:8px;
            color:#64748B;
            cursor:pointer;
        }

        .remember input{
            width:16px;
            height:16px;
          margin:0;
        }

        .form-options a{
            color:#2563EB;
            text-decoration:none;
            font-weight:500;
        }

        .form-options a:hover{
            text-decoration:underline;
        }

        .register{
            margin-top:32px;
            text-align:center;
        }

        .register p{
            margin-bottom:8px;
            color:#64748B;
            font-size:14px;
        }

        .register a{
            color:#2563EB;
            text-decoration:none;
            font-weight:600;
        }

        .register a:hover{
            text-decoration:underline;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="box">

            <div class="logo">

                <img src="/static/img/talentai-logo.png"
                     alt="TalentAI">

            </div>

            <h2>Welcome back</h2>

            <p class="description">
              Sign in to your AI-powered talent intelligence platform.
            </p>        

    <form method="post" action="/login">

            <div class="form-group">

            <label>Work Email</label>

            <input
                type="email"
                name="email"
                placeholder="name@company.com"
                required>

            </div>

            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    name="senha"
                    placeholder="Enter your password"
                    required>

            </div>

            <div class="form-options">

                <label class="remember">

                    <input type="checkbox">

                    <span>Remember me</span>

                </label>

                <a href="#">
                    Forgot password?
                </a>

            </div>

            <button type="submit">
                Sign In
            </button>

        </form>

            {% if erro %}
            <p style="color:red;text-align:center;margin-top:15px;">
                {{ erro }}
            </p>
            {% endif %}

            <div class="register">

                <p>Don't have an account?</p>

                <a href="/register">
                    Create your workspace →
                </a>

            </div>

        </div>

    </div>

</body>

</html>
